<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG 이미지 소스 (1200x630 스크린숏용)</title>
<style>
  :root {
    --bg: #0f141b;
    --bg-cover: #10151c;
    --border: #232d3a;
    --text: #e6ebf2;
    --muted: #9aa6b5;
    --faint: #6b7684;
    --accent: #f2b23e;
    --v1: #f2b23e; --v2: #a78bfa; --v3: #34d399; --v4: #4cc2f0; --v5: #f26d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(rgba(255,255,255,0.03) 1.5px, transparent 2px) 0 0 / 26px 26px,
      var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
    display: flex; align-items: center;
    padding: 0 64px;
    gap: 48px;
  }
  .left { flex: 1 1 auto; min-width: 0; }
  .eyebrow { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 22px; letter-spacing: 0.02em; }
  h1 { font-size: 78px; font-weight: 800; line-height: 1.14; letter-spacing: -0.02em; margin-bottom: 26px; }
  .bar { width: 52px; height: 6px; background: var(--accent); border-radius: 3px; margin-bottom: 26px; }
  .sub { font-size: 29px; color: var(--muted); line-height: 1.5; margin-bottom: 34px; }
  .meta { font-size: 21px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .meta span + span::before { content: "·"; margin: 0 12px; color: var(--border); }

  .shelf { display: flex; gap: 13px; align-items: flex-start; flex: none; }
  .shelf .cover:nth-child(2n) { margin-top: 22px; }
  .cover {
    width: 106px; height: 150px;
    background:
      radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1.5px) 0 0 / 13px 13px,
      var(--bg-cover);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 12px 11px 11px;
    display: flex; flex-direction: column;
  }
  .cover-num {
    font-size: 38px; font-weight: 800; line-height: 1;
    color: transparent; -webkit-text-stroke: 1.4px var(--va);
  }
  .cover-title { margin-top: auto; font-size: 11.5px; font-weight: 700; line-height: 1.35; white-space: pre-line; }
  .cover-bar { width: 24px; height: 3px; background: var(--va); border-radius: 2px; margin: 8px 0 9px; }
  .cover-dots { display: flex; gap: 4px; }
  .cover-dots i { width: 4.5px; height: 4.5px; border-radius: 50%; background: #2b3543; }
  .cover.v1 { --va: var(--v1); } .cover.v1 .cover-dots i:nth-child(1) { background: var(--va); }
  .cover.v2 { --va: var(--v2); } .cover.v2 .cover-dots i:nth-child(2) { background: var(--va); }
  .cover.v3 { --va: var(--v3); } .cover.v3 .cover-dots i:nth-child(3) { background: var(--va); }
  .cover.v4 { --va: var(--v4); } .cover.v4 .cover-dots i:nth-child(4) { background: var(--va); }
  .cover.v5 { --va: var(--v5); } .cover.v5 .cover-dots i:nth-child(5) { background: var(--va); }
</style>
</head>
<body>
  <div class="left">
    <p class="eyebrow">PDF 전자책 · 전 5권</p>
    <h1>클로드코드<br>마스터클래스</h1>
    <div class="bar"></div>
    <p class="sub">바이브코딩 입문자를 개발자로 만드는<br>다섯 권의 로드맵</p>
    <p class="meta"><span>34개 장</span><span>A4 219페이지</span><span>크몽 판매</span></p>
  </div>
  <div class="shelf">
    <div class="cover v1"><span class="cover-num">1</span><span class="cover-title">클로드코드
기초</span><span class="cover-bar"></span><span class="cover-dots"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="cover v2"><span class="cover-num">2</span><span class="cover-title">하네스
엔지니어링</span><span class="cover-bar"></span><span class="cover-dots"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="cover v3"><span class="cover-num">3</span><span class="cover-title">무료 클라우드
로컬 AI</span><span class="cover-bar"></span><span class="cover-dots"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="cover v4"><span class="cover-num">4</span><span class="cover-title">RAG
검색증강</span><span class="cover-bar"></span><span class="cover-dots"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="cover v5"><span class="cover-num">5</span><span class="cover-title">사이트·앱
운영 실전</span><span class="cover-bar"></span><span class="cover-dots"><i></i><i></i><i></i><i></i><i></i></span></div>
  </div>
</body>
</html>
