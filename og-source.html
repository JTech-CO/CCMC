<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG 이미지 소스 (1200x630 스크린숏용)</title>
<style>
  :root {
    --bg: #0f141b;
    --bg-cover: #10151c;
    --border: #232d3a;
    --text: #e6ebf2;
    --muted: #9aa6b5;
    --faint: #6b7684;
    --accent: #f2b23e;
    --v1: #f2b23e; --v2: #a78bfa; --v3: #34d399; --v4: #4cc2f0; --v5: #f26d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(rgba(255,255,255,0.03) 1.5px, transparent 2px) 0 0 / 26px 26px,
      var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", sans-serif;
    word-break: keep-all;
    display: flex; align-items: center;
    padding: 0 60px;
    gap: 40px;
  }
  .left { flex: 1 1 auto; min-width: 0; }
  .eyebrow { font-size: 21px; font-weight: 700; color: var(--accent); margin-bottom: 20px; letter-spacing: 0.02em; white-space: nowrap; }
  h1 { font-size: 70px; font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; margin-bottom: 24px; }
  .bar { width: 52px; height: 6px; background: var(--accent); border-radius: 3px; margin-bottom: 24px; }
  .sub { font-size: 27px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 30px; }
  .sub em { font-style: normal; font-weight: 400; font-size: 24px; color: var(--muted); }
  .meta { font-size: 20px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta span + span::before { content: "·"; margin: 0 11px; color: var(--border); }

  .shelf { display: flex; gap: 11px; align-items: flex-start; flex: none; }
  .shelf .cover:nth-child(2n) { margin-top: 22px; }
  .cover {
    width: 98px; height: 148px;
    background:
      radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1.5px) 0 0 / 13px 13px,
      var(--bg-cover);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 12px 10px 11px;
    display: flex; flex-direction: column;
  }
  .cover-num { font-size: 38px; font-weight: 800; line-height: 1; color: var(--va); }
  .cover-title { margin-top: auto; font-size: 14px; font-weight: 700; line-height: 1.3; white-space: pre-line; }
  .cover-bar { width: 24px; height: 3px; background: var(--va); border-radius: 2px; margin-top: 9px; }
  .cover.v1 { --va: var(--v1); } .cover.v2 { --va: var(--v2); } .cover.v3 { --va: var(--v3); }
  .cover.v4 { --va: var(--v4); } .cover.v5 { --va: var(--v5); }
</style>
</head>
<body>
  <div class="left">
    <p class="eyebrow">클로드코드 마스터클래스 · 전 5권</p>
    <h1>데모까지는<br>누구나 갑니다</h1>
    <div class="bar"></div>
    <p class="sub">진짜 벽은 그다음입니다<br><em>배포, 운영, 검색까지<br>다섯 권으로 넘습니다</em></p>
    <p class="meta"><span>34개 장</span><span>A4 219페이지</span><span>크몽 판매</span></p>
  </div>
  <div class="shelf">
    <div class="cover v1"><span class="cover-num">1</span><span class="cover-title">클로드코드
기초</span><span class="cover-bar"></span></div>
    <div class="cover v2"><span class="cover-num">2</span><span class="cover-title">하네스
엔지니어링</span><span class="cover-bar"></span></div>
    <div class="cover v3"><span class="cover-num">3</span><span class="cover-title">클라우드
로컬 AI</span><span class="cover-bar"></span></div>
    <div class="cover v4"><span class="cover-num">4</span><span class="cover-title">RAG
검색증강</span><span class="cover-bar"></span></div>
    <div class="cover v5"><span class="cover-num">5</span><span class="cover-title">사이트·앱
운영 실전</span><span class="cover-bar"></span></div>
  </div>
</body>
</html>
